[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kabyle-research-agents"
version = "0.2.0"
description = "Catalog research assistant with cited answers, optional RAG and agent protocol adapters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # standard library only: the core must stay auditable

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8,<9", "httpx>=0.27,<1"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
semantic = ["sentence-transformers>=3,<4"]
protocols = ["mcp==1.30.0", "a2a-sdk[http-server]==0.3.22", "uvicorn>=0.30,<1"]
trust = ["cryptography>=43", "PyJWT>=2.9,<3", "httpx>=0.27,<1", "web3>=7,<8"]

[project.scripts]
kabyle-agents = "kabyle_agents.cli:main"
kabyle-mcp = "kabyle_agents.mcp_server:main"
kabyle-a2a = "kabyle_agents.a2a_server:main"
kabyle-tools = "kabyle_agents.toolbox:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.package-data]
kabyle_agents = ["static/*"]
